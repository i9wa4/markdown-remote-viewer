version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: mdview
    binary: mdview
    main: ./cmd/mdview
    ldflags:
      - -s -w
      - -X github.com/i9wa4/markdown-remote-viewer/internal/version.Version={{.Tag}}
      - -X github.com/i9wa4/markdown-remote-viewer/internal/version.Commit={{.ShortCommit}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: mdview
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: i9wa4
    name: markdown-remote-viewer
  draft: false
  prerelease: auto

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
  groups:
    - title: Features
      regexp: "^feat:"
      order: 0
    - title: Bug Fixes
      regexp: "^fix:"
      order: 1
    - title: Others
      order: 999
